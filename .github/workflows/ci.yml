name: CI
on:
  push:
    branches:
      - '**' # run on all branches
  pull_request:
    branches:
      - '**' # run on all branches
  pull_request_target:
    branches:
      - '**' # run on all branches

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - uses: actions/dependency-review-action@v4

  pydocstyle:
    name: Pydocstyle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements/production.txt -r requirements/testing.txt
      - name: Pydocstyle
        run: pydocstyle pyvlx test/*.py *.py examples/*.py

  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements/production.txt -r requirements/testing.txt
      - name: Flake8
        run: flake8
      - name: Linter Pylint
        run: PYTHONPATH=. pylint --rcfile=.pylintrc pyvlx test/*.py *.py examples/*.py
      - name: Isort
        run: isort --check-only test examples pyvlx

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements/production.txt -r requirements/testing.txt
      - name: Mypy
        run: mypy --install-types --non-interactive pyvlx

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements/production.txt -r requirements/testing.txt
      - name: pytest
        run: PYTHONPATH=. pytest --cov pyvlx --cov-report xml
      - name: Combine coverage
        run: |
          if [ -f .coverage ]; then
            cp .coverage .coverage.${{ matrix.python-version }}
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*
          include-hidden-files: true

  build:
    name: Build & Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ["pydocstyle", "lint", "mypy", "pytest"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements/production.txt -r requirements/testing.txt
      - name: Install pre-commit
        run: pip install pre-commit==3.7.0
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage*
          include-hidden-files: true

  pre-commit:
    name: Pre-commit (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install pre-commit
        run: pip install pre-commit==3.7.0
      - name: Run pre-commit
        run: pre-commit run
